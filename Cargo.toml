[package]
name = "conf-balances-examples"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "demo-server"
path = "src/bin/demo-server.rs"

[dependencies]
# Solana core via granular crates, no solana-sdk umbrella. solana-client 4.3
# (stable) sends v1 transactions through wincode; solana-message 4.6 has the
# v1 module (TransactionConfig in the header, 4096-byte limit). Everything
# resolves to one solana-instruction 3.5.x / solana-address 2.7.x stack, so
# Pubkey == Address and no conversions are needed. VersionedTransaction::try_new
# is behind solana-transaction's "wincode" feature.
solana-client = "4.3.0"
solana-pubkey = "4.3"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-signature = "3.5"
solana-transaction = { version = "4.3", features = ["wincode"] }
solana-message = "4.6"
solana-instruction = "3.5"
solana-native-token = "3.0"
solana-zk-sdk = "7.0.1"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }

# SPL Token-2022. Single transfers, withdraws, and configures carry their
# proofs inline via ProofLocation::InstructionOffset in one v1 transaction;
# proof-generation 0.6.1 is the zk-sdk 7 line. new_from_signer_legacy keeps
# key derivation byte-identical to the pre-7 new_from_signer.
spl-token-2022 = { version = "11.0.0", features = ["zk-ops"] }
spl-associated-token-account = "8.0.0"
spl-token-confidential-transfer-proof-extraction = "0.6.1"
spl-token-confidential-transfer-proof-generation = "0.6.1"

# ZK ElGamal proof-program helpers. Still used by the batch and fee flows,
# which pre-verify proofs into context state accounts.
solana-zk-elgamal-proof-interface = "0.1.2"
solana-zk-sdk-pod = "0.1.2"
solana-address = "2.6"

# Transfer-with-fee: the U256 range proof verify ix exceeds the 1232-byte tx
# limit, so its bytes are staged into an spl-record account (bytemuck to view
# the proof data as bytes) and verified from there.
spl-record = { version = "0.4.0", features = ["no-entrypoint"] }
bytemuck = "1.25"

# Batched transfers (option 1): pack N transfer ixs into one v0 transaction
# whose account list is compressed by an Address Lookup Table, plus a compute
# budget bump so the batch clears the per-tx CU ceiling.
solana-address-lookup-table-interface = { version = "3.1.0", features = ["bincode"] }
solana-compute-budget-interface = "3.0.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Commitment config
solana-commitment-config = "3.1.1"

# Demo server
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }

# Utilities
hex = "0.4"
serde_json = "1.0"

[dev-dependencies]
# solana-test-validator = "=4.0.0-rc.0"
env_logger = "0.11"
serde_json = "1.0"
solana-commitment-config = "3.1.1"
